name: intern-radar
on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~7am ET
  workflow_dispatch:
    inputs:
      discover:
        description: "Re-check every company for a job board (slow, ~20 min)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # rediscover boards on the 1st of each month, or when asked
      - run: |
          if [ "${{ inputs.discover }}" = "true" ] || [ "$(date +%d)" = "01" ] || [ ! -f boards.json ]; then
            python radar.py --discover
          else
            python radar.py
          fi
      - run: |
          git config user.name "intern-radar"
          git config user.email "intern-radar@users.noreply.github.com"
          git add boards.json results.csv RESULTS.md
          git commit -m "radar: $(date -u +%F)" || echo "no changes"
          git push
